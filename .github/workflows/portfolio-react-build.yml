name: Portfolio React build
on:
  push:
    branches:
      - portfolio/2026-editorial-redesign
    paths:
      - "portfolio-site/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/portfolio-react-build.yml"
  pull_request:
    paths:
      - "portfolio-site/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/portfolio-react-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
